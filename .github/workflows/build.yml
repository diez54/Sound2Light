name: Build Sound2LightMultiTrack

on:
  push:
    branches: [ master, main, multitrack ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- macOS
  # intel : official Qt 5.15.2, x86_64, macOS 10.13+. Runs on Intel Macs AND on Apple Silicon (Rosetta).
  # arm64 : Homebrew Qt, native Apple Silicon. Needs a recent macOS (see the "minimum macOS" notice).
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
            qt: official
            min: '10.13'
          - runner: macos-14
            arch: arm64
            qt: brew
            min: '11.0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (official)
        if: matrix.qt == 'official'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Patch Qt 5.15.2 for recent Xcode (AGL framework was removed)
        if: matrix.qt == 'official'
        run: |
          sed -i '' 's/-framework AGL//g' "$QT_ROOT_DIR/mkspecs/common/mac.conf"
          grep -n "AGL" "$QT_ROOT_DIR/mkspecs/common/mac.conf" || true

      - name: Install Qt 5 (Homebrew)
        if: matrix.qt == 'brew'
        run: |
          brew install qt@5
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cd src
          qmake S2L.pro CONFIG+=release S2L_MACOS_MIN=${{ matrix.min }}
          make -j"$(sysctl -n hw.ncpu)"

      - name: Bundle Qt and make DMG
        run: |
          cd src
          APP="Sound2LightMultiTrack.app"
          macdeployqt "$APP" -qmldir=qml
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion ${{ matrix.min }}" "$APP/Contents/Info.plist"
          # ad-hoc signature (required on Apple Silicon, no Apple developer account needed)
          codesign --force --deep --sign - "$APP"
          mkdir dmg && cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Sound2LightMultiTrack" -srcfolder dmg -ov -format UDZO ../Sound2LightMultiTrack-macOS-${{ matrix.arch }}.dmg

      - name: Check every binary in the bundle (minimum macOS, no Homebrew paths)
        run: |
          cd src
          APP="Sound2LightMultiTrack.app"
          MIN="${{ matrix.min }}"
          minos() { otool -l "$1" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{g=1} g&&/version/{print $2; exit}'; }
          vgt() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ] && [ "$1" != "$2" ]; }
          WORST="0"; WORSTFILE=""; BAD=""; LEAK=""
          while IFS= read -r f; do
            file -b "$f" | grep -q "Mach-O" || continue
            v=$(minos "$f"); [ -z "$v" ] && continue
            if vgt "$v" "$WORST"; then WORST="$v"; WORSTFILE="${f#$APP/}"; fi
            if vgt "$v" "$MIN"; then BAD="$BAD ${f#$APP/}=$v"; fi
            l=$(otool -L "$f" | tail -n +2 | grep -E "/opt/homebrew|/usr/local" || true)
            [ -n "$l" ] && LEAK="$LEAK ${f#$APP/}:$(echo $l | tr '\n' ' ')"
          done < <(find "$APP" -type f \( -perm -u+x -o -name "*.dylib" \))
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Sound2LightMultiTrack")
          echo "::notice title=bundle check (${{ matrix.arch }})::archs=$ARCHS target=$MIN highest=$WORST ($WORSTFILE)"
          if [ -n "$BAD" ]; then echo "::error title=needs a newer macOS than $MIN::$(echo $BAD | cut -c1-1500)"; exit 1; fi
          if [ -n "$LEAK" ]; then echo "::error title=Homebrew paths left in the bundle::$(echo $LEAK | cut -c1-1500)"; exit 1; fi

      - name: Smoke test (launch the bundled app with the test signal)
        run: |
          cd src
          APP="Sound2LightMultiTrack.app"
          test -d "$APP/Contents/Frameworks/QtQuick.framework"
          test -d "$APP/Contents/PlugIns/platforms"
          ls -d "$APP"/Contents/Resources/qml/QtQuick/Controls
          mkdir -p ~/.config/Sound2Light
          printf '[General]\nformatVersion=1\ninputDeviceName=Signal de test (8 canaux)\n' > ~/.config/Sound2Light/Sound2LightMultiTrack.ini
          "$APP/Contents/MacOS/Sound2LightMultiTrack" > run.log 2>&1 &
          PID=$!
          sleep 10
          cat run.log
          if ! kill -0 $PID; then
            echo "::error title=Smoke test::the app crashed or quit%0A$(tail -c 3000 run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')"; exit 1
          fi
          kill $PID
          if grep -E "is not installed|failed to load|Could not find the Qt platform plugin|ReferenceError|TypeError" run.log; then
            echo "::error title=Smoke test::QML or plugin problem%0A$(tail -c 3000 run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Sound2LightMultiTrack-macOS-${{ matrix.arch }}
          path: Sound2LightMultiTrack-macOS-${{ matrix.arch }}.dmg

  # ---------------------------------------------------------------- Windows (x64)
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build (WASAPI + ASIO)
        shell: cmd
        run: |
          cd src
          qmake S2L.pro CONFIG+=release CONFIG+=asio
          nmake

      - name: Bundle Qt
        shell: cmd
        run: |
          mkdir dist
          copy src\release\Sound2LightMultiTrack.exe dist\Sound2LightMultiTrack.exe
          windeployqt --release --qmldir src\qml "dist\Sound2LightMultiTrack.exe"

      - name: Smoke test (launch the bundled app with the test signal)
        shell: pwsh
        run: |
          function Fail($msg) {
            $log = if (Test-Path run.log) { (Get-Content run.log -Raw) } else { "(no log)" }
            $log = ($log -replace "%", "%25") -replace "`r", "" -replace "`n", "%0A"
            Write-Output "::error title=Smoke test::$msg"
            Write-Output "::warning title=App log::$log"
            Write-Output ("::warning title=dist content::" + ((Get-ChildItem dist -Name) -join ", "))
            exit 1
          }
          if (-not (Test-Path dist\QtQuick\Controls)) { Fail "QtQuick Controls missing in dist" }
          if (-not (Test-Path dist\platforms\qwindows.dll)) { Fail "platform plugin qwindows.dll missing" }
          New-Item -ItemType Directory -Force "$env:APPDATA\Sound2Light" | Out-Null
          "[General]`r`nformatVersion=1`r`ninputDeviceName=Signal de test (8 canaux)`r`n" | Set-Content -Encoding UTF8 "$env:APPDATA\Sound2Light\Sound2LightMultiTrack.ini"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $p = Start-Process -FilePath dist\Sound2LightMultiTrack.exe -PassThru -RedirectStandardError run.log -RedirectStandardOutput out.log
          Start-Sleep -Seconds 10
          Get-Content run.log
          if ($p.HasExited) { Fail "the app quit after start (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          if (Select-String -Path run.log -Pattern "is not installed","failed to load","Could not find the Qt platform plugin","ReferenceError","TypeError" -Quiet) {
            Fail "QML or plugin problem"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Sound2LightMultiTrack-Windows-x64
          path: dist

  # ---------------------------------------------------------------- Linux (compile check)
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev libasound2-dev libpulse-dev
      - name: Build
        run: |
          cd src
          qmake S2L.pro CONFIG+=release
          make -j"$(nproc)"

  # ---------------------------------------------------------------- Release on tag
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Zip Windows build
        run: cd Sound2LightMultiTrack-Windows-x64 && zip -r ../Sound2LightMultiTrack-Windows-x64.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Sound2LightMultiTrack-macOS-arm64/Sound2LightMultiTrack-macOS-arm64.dmg
            Sound2LightMultiTrack-macOS-intel/Sound2LightMultiTrack-macOS-intel.dmg
            Sound2LightMultiTrack-Windows-x64.zip
